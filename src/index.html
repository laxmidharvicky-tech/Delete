<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-..."
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./output.css" />
  </head>
  <body class="bg-red-200">
    <div class="max-w-screen min-h-screen flex justify-center items-center">
      <div class="border-none rounded-2xl shadow-2xl h-72 p-4 w-96 bg-white">
        <div class="flex justify-center items-center mt-4 mb-8">
          <i class="fa-solid fa-trash text-red-500 text-6xl"></i>
        </div>
        <div class="text-center leading-7">
          <h1 class="text-xl font-bold">Delete Notes?</h1>
          <p class="font-light">your note will be permanently</p>
          <p class="font-light mb-6">deleted and cannot be recovered</p>
          <div class="flex justify-around">
            <button
              class="border-none w-18 p-1 rounded-2xl bg-gray-300 transition delay-150 duration-300 ease-in-out hover:-translate-y-1 hover:scale-110 hover:bg-gray-600 hover:text-white"
            >
              Cancel
            </button>
            <button class="border-none w-18 p-1 rounded-2xl bg-red-600 text-white transition delay-150 duration-300 ease-in-out hover:-translate-y-1 hover:scale-110 hover:bg-red-900 hover:text-white">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
